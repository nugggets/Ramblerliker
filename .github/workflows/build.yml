name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/debug/app-debug.apk "RamblerLiker-v$VER.apk"
          gh release delete "v$VER" --yes --cleanup-tag || true
          gh release create "v$VER" "RamblerLiker-v$VER.apk" --title "v$VER" --notes "build ${{ github.run_number }}"
      - uses: actions/upload-artifact@v4
        with:
          name: RamblerLiker-apk
          path: app/build/outputs/apk/debug/app-debug.apk
